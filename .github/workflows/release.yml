name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: github.repository == 'zakariagharzouli/sparda'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Run Release Gate
        run: npm run release:check

      # VSCE_PAT is required for the VS Code Marketplace extension publish.
      # NPM Trusted Publishing relies on OIDC id-token and does not use NPM_TOKEN.
      - name: Check secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "UNVERIFIED: VSCE_PAT is not set — refusing to report a release we cannot perform."
            exit 1
          fi

      - name: Publish to NPM
        run: npm publish

      # `@vscode/vsce`, pinned: the bare `vsce` package is the deprecated old name, and an
      # unpinned `npx` resolves whatever is newest at publish time — the one moment the toolchain
      # must not be a moving target.
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@3.9.2 publish
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
